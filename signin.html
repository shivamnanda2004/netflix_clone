<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix — Sign In</title>
  <link rel="stylesheet" href="signin.css">
</head>
<body>

  <div class="hero"></div>

  <div class="shell">
    <header>
      <img src="netflix1.png" class="logo" alt="Netflix"
           onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block'">
      <svg id="logo-fallback" class="logo-svg" style="display:none" viewBox="0 0 167 45" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Netflix">
        <text x="0" y="38" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
              font-weight="800" font-size="42" fill="#E50914" letter-spacing="-1">NETFLIX</text>
      </svg>
    </header>

    <main>
      <div class="card">
        <h1>Sign in</h1>

        <div class="field">
          <input type="email" id="email" placeholder="Email" autocomplete="email">
          <label for="email">Email or mobile number</label>
        </div>

        <div class="field">
          <input type="password" id="password" placeholder="Password" autocomplete="current-password">
          <label for="password">Password</label>
        </div>

        <button class="btn-primary">Sign in</button>

        <div class="or-divider">OR</div>

        <button class="btn-code">Use a sign-in code</button>

        <div class="remember-row">
          <label>
            <input type="checkbox" checked> Remember me
          </label>
          <a href="#" class="need-help">Need help?</a>
        </div>

        <div class="card-footer">
          <p>New to Netflix? <a href="#">Sign up now.</a></p>
          <p class="recaptcha-note">
            This page is protected by Google reCAPTCHA to ensure you're not a bot.
            <a href="#">Learn more.</a>
          </p>
        </div>
      </div>
    </main>

    <footer>
      <p class="call">Questions? Call <a href="tel:0008009191743" style="color:#737373">000-800-919-1743</a> (Toll-Free)</p>
      <div class="footer-links">
        <a href="faq.html">FAQ</a>
        <a href="helpcentre.html">Help Centre</a>
        <a href="termsofuse.html">Terms of Use</a>
        <a href="privacy.html">Privacy</a>
        <a href="cp.html">Cookie Preferences</a>
        <a href="ci.html">Corporate Information</a>
      </div>
      <div class="language-wrap">
        <svg class="globe-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8" cy="8" r="6.5" stroke="#737373" stroke-width="1.2"/>
          <ellipse cx="8" cy="8" rx="2.5" ry="6.5" stroke="#737373" stroke-width="1.2"/>
          <line x1="1.5" y1="6" x2="14.5" y2="6" stroke="#737373" stroke-width="1.2"/>
          <line x1="1.5" y1="10" x2="14.5" y2="10" stroke="#737373" stroke-width="1.2"/>
        </svg>
        <select class="language-select" aria-label="Language">
          <option>English</option>
          <option>हिन्दी</option>
        </select>
      </div>
    </footer>
  </div>

</body>
</html>
